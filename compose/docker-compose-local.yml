services:
  frontend:
    build:
      context: ../src/frontend
    container_name: frontend
    ports:
      - "8080:8080"
    depends_on:
      - user-service
    restart: unless-stopped
    networks:
      - roboshop

  user-service:
    build:
      context: ../src/user
    container_name: user-service
    environment:
      USER_SERVER_PORT: 8080
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongodb:27017/users
      NODE_ENV: production
    depends_on:
      - redis
      - mongodb
    restart: unless-stopped
    networks:
      - roboshop

  catalogue-service:
    build:
      context: ../src/catalogue
    container_name: catalogue-service
    environment:
      CATALOGUE_SERVER_PORT: 8080
      MONGO: "true"
      MONGO_URL: mongodb://mongodb:27017/catalogue
    depends_on:
      - mongodb
    volumes:
    - mongo-data:/data/db
    - ../db:/docker-entrypoint-initdb.d
    networks:
      - roboshop

  cart-service:
    build:
      context: ../src/cart
    environment:
      REDIS_HOST: redis
      CATALOGUE_HOST: catalogue-service
      CATALOGUE_PORT: 8080
    depends_on:
      - redis
      - catalogue-service
    networks:
      - roboshop

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: RoboShop@1
    volumes:
      - mysql-data:/var/lib/mysql
      - ../src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ../src/db/app-user.sql:/docker-entrypoint-initdb.d/app-user.sql
      - ../src/db/master-data.sql:/docker-entrypoint-initdb.d/master-data.sql
    networks:
      - roboshop

  payment-service:
    build:
      context: ../src/payment
    environment:
      CART_HOST: cart-service
      CART_PORT: 8080
      USER_HOST: user-service
      USER_PORT: 8080
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    depends_on:
      - cart-service
      - user-service
      - rabbitmq
    networks:
      - roboshop

  redis:
    build:
      context: ../src/redis
    container_name: redis
    command:
      [
        "redis-server",
        "--bind",
        "0.0.0.0",
        "--protected-mode",
        "no"
      ]
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - roboshop

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - roboshop

  mongodb:
    build:
      context: ../src/mongodb
    container_name: mongodb
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - roboshop

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    restart: unless-stopped
    networks:
      - roboshop

volumes:
  mongo-data:
  mysql-data:

networks:
  roboshop:
    driver: bridge
